name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: No personal paths
        run: node scripts/ci/validate-no-personal-paths.js

      - name: Validate skills
        run: node scripts/ci/validate-skills.js --strict

      - name: Validate install manifests
        run: node scripts/ci/validate-install-manifests.js

      - name: Validate manifest coverage (no orphan skills)
        run: node scripts/ci/validate-manifest-coverage.js --strict

      - name: Validate skill cross-links (Related skills)
        run: node scripts/ci/validate-skill-links.js --strict

      - name: Skill count source of truth
        run: node scripts/ci/count-skills.js

      - name: Supply-chain IoC scan
        run: node scripts/ci/scan-supply-chain-iocs.js