# pytest.ini — smoke/flaky markers, HTML report, 60s per-test timeout
# Extraído de SKILL.md (2026-09-09). Coloque em tests/pytest.ini
[pytest]
testpaths = tests
markers =
    smoke: fast smoke tests for critical paths
    flaky: known-unstable tests
addopts = -v --tb=short --html=artifacts/report.html --self-contained-html
timeout = 60
timeout_method = thread
